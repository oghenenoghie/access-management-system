# Sized for low-memory PCs (the template default asks for an 8 GB heap).
# Raise -Xmx if builds fail with "OutOfMemoryError" on a machine with more RAM.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
# Compile Kotlin inside the Gradle daemon instead of a second JVM.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
