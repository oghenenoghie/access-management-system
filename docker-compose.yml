version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: estate-gate-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./estate_access.db
      # Secrets come from your shell or a .env file next to this file (git-ignored).
      # Left empty for local use, the backend generates its own private key.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - APP_ENV=${APP_ENV:-development}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  admin-dashboard:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./admin-dashboard:/app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
