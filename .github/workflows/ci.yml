name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # SQLAlchemy 2.0.35 (pinned) has no wheels for newer Pythons.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: estate
          POSTGRES_PASSWORD: estate
          POSTGRES_DB: estate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estate -d estate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # A throwaway CI database: the tests drop and recreate its tables.
      TEST_DATABASE_URL: postgresql://estate:estate@localhost:5432/estate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest

  backend-container:
    name: Backend container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag estate-backend ./backend

  admin-dashboard:
    name: Admin dashboard type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  gate-app:
    name: Gate app analysis and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - run: flutter pub get
      # Info-level hints (such as deprecations) are reported but don't fail the build.
      - run: flutter analyze --no-fatal-infos
      # Widget tests in both demo modes (debug default, and as in release builds).
      - run: flutter test
      - run: flutter test --dart-define=DEMO_MODE=false
