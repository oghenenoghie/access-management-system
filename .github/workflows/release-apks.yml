name: Release APKs

# Builds signed release APKs of both apps on GitHub's servers.
# Start it from the Actions tab ("Run workflow") and enter the backend's HTTPS
# address. Needs these repository secrets (see docs/DEPLOYMENT.md):
#   GATE_KEYSTORE_BASE64, GATE_KEYSTORE_PASSWORD
#   RESIDENT_KEYSTORE_BASE64, RESIDENT_KEYSTORE_PASSWORD

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend address the apps use, e.g. https://estate-api.up.railway.app"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-apks
  cancel-in-progress: false

jobs:
  check-input:
    name: Check inputs
    runs-on: ubuntu-latest
    steps:
      - name: Backend address must be HTTPS
        env:
          API_URL: ${{ inputs.api_base_url }}
        run: |
          case "$API_URL" in
            https://*) echo "Building for $API_URL" ;;
            *) echo "::error::api_base_url must start with https:// (release builds only allow HTTPS)"; exit 1 ;;
          esac

  gate-app:
    name: Gate security app (Flutter)
    needs: check-input
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - name: Install the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GATE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GATE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::GATE_KEYSTORE_BASE64 / GATE_KEYSTORE_PASSWORD secrets are missing"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gate-upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/gate-upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
          } > android/key.properties
      - run: flutter pub get
      - name: Build the release APK
        env:
          API_URL: ${{ inputs.api_base_url }}
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-number "${{ github.run_number }}" \
            --dart-define=API_BASE_URL="$API_URL"
      - name: Check the signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
          mv build/app/outputs/flutter-apk/app-release.apk "estate-gate-security-build${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: estate-gate-security-build${{ github.run_number }}
          path: mobile-flutter/estate-gate-security-build${{ github.run_number }}.apk
          retention-days: 30

  resident-app:
    name: Resident app (Expo)
    needs: check-input
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-expo
    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-expo/package-lock.json
      - run: npm ci
      - name: Install the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RESIDENT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RESIDENT_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::RESIDENT_KEYSTORE_BASE64 / RESIDENT_KEYSTORE_PASSWORD secrets are missing"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/resident-upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/resident-upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
          } > release-signing.properties
      - name: Set the version code to this build number
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            config.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2));
          '
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build the release APK
        env:
          # Read when the JavaScript bundle is built into the APK.
          EXPO_PUBLIC_API_URL: ${{ inputs.api_base_url }}
        working-directory: mobile-expo/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon
      - name: Check the signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          mv "$APK" "estate-resident-build${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: estate-resident-build${{ github.run_number }}
          path: mobile-expo/estate-resident-build${{ github.run_number }}.apk
          retention-days: 30
